#type = custom/script
#exec = echo  
#exec-if = pactl list sources | grep -A 10 $(pactl get-default-source) | grep "Mute: yes"  
##exec-if = pactl list sources | grep "Mute: yes"  
#interval = 5
#label = %output%
#click-left = pactl set-source-mute @DEFAULT_SOURCE@ toggle 

[module/mic-muted]
type = custom/ipc
hook-0 = echo ""
hook-1 = echo  
click-left = pactl set-source-mute @DEFAULT_SOURCE@ toggle

[module/xkeyboard]
type = internal/xkeyboard
label-layout =  
label-indicator-on = %icon%
indicator-icon-0 = caps lock;;󰪛
#label-indicator-on-shiftlock = %name% 
#indicator-icon-11 = shift lock;;^


