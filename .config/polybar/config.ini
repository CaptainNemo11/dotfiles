[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = 󰌙
[module/wlan]
inherit = network-base
interface-type = wireless
format-connected = %{A3:nm-connection-editor:}%{A1:$HOME/.config/rofi/network:}<ramp-signal>%{A}%{A}
format-disconnected = %{A3:nm-connection-editor:}%{A1:$HOME/.config/rofi/network:}󰤭%{A}%{A}
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨

[module/eth]
inherit = network-base
interface-type = wired
format-connected = %{A3:nm-connection-editor:}%{A1:$HOME/.config/rofi/network:}󰌘 %{A}%{A}
format-disconnected = %{A3:nm-connection-editor:}%{A1:$HOME/.config/rofi/network:}󰌙 %{A}%{A}
unknown-as-up = true

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %A, %d %B %Y
label =  %date%

#[module/bluetooth]
#type = custom/script
#exec = bluetoothctl devices Connected | grep Device | wc -l 
#label =󰂱 %output%
#click-left = ~/.config/rofi/bluetooth
#click-right = blueman-manager

[module/bluetooth]
type = custom/ipc
hook-0 = sleep 0.1 && bluetoothctl devices Connected | grep Device | wc -l
format = 󰂱 <output>
initial = 1
click-left = ~/.config/rofi/bluetooth
click-right = blueman-manager



#[module/headset]
#type = custom/script
#exec = echo 
#exec-if = pactl info | grep "Default Sink: bluez"
#interval = 5
#label = %output%

[module/headset]
type = custom/ipc
hook-0 = echo ""
hook-1 = echo 
click-left = notify-send -u normal -a "system_status" "$(pactl list sinks | awk -v def="$(pactl get-default-sink)" '$0 ~ "Name: " def {found=1} found && /Description: / {sub(/^[ \t]*Description:[ \t]*/, ""); print;exit}')"
click-right = pavucontrol

[module/capslock]
type = custom/script
exec = echo 󰪛
exec-if = xset -q | grep "Caps Lock:   on"
interval = 1
label = %output%
label-font = 2

[module/shiftlock]
type = custom/script
exec = xset -q | grep -q "Shift Lock:  on" && echo "󰘶 " || echo ""
interval = .2
label = %output%
label-font = 2

[module/power]
type = custom/text
format = ⏻ 
click-left = rofi -show menu -modi "menu:~/.config/rofi/power" -theme ~/.config/rofi/power.rasi
click-right = ~/.config/polybar/menu

[module/apps]
type = custom/text
format = 
click-left = ~/.config/polybar/apps
click-right = ~/.config/polybar/menu

[module/quickmemo]
type = custom/text
format = 󰃀
click-left = ~/.config/polybar/quickmemo
click-right = ~/.config/polybar/quicknote

[module/lock]
type = custom/text
format = 󰌾
click-left = loginctl lock-session
click-right = ~/.config/polybar/menu

#[module/mpris]
#type = custom/script
#exec = ~/.config/polybar/mpris
#exec-if = playerctl -a status | grep -E "Paused|Playing"
#label = %output%
#label-maxlen = 40
#click-left = playerctl -p playerctld play-pause
#click-right = playerctl -p playerctld next
#double-click-right = playerctl -p playerctld previous

[module/mpris]
type = custom/ipc
hook-0 = sleep 0.1 && ~/.config/polybar/mpris
initial = 1
label = %output%
label-maxlen = 40
click-left = playerctl -p playerctld play-pause
click-right = playerctl -p playerctld next
double-click-right = playerctl -p playerctld pervious

#[module/powerprofile]
#type = custom/script
#exec = ~/.config/polybar/powerprofile
#label = %output%
#interval = 20
#click-left = asusctl profile next

[module/powerprofile]
type = custom/ipc
hook-0 = ~/.config/polybar/powerprofile
initial = 1
click-left = asusctl profile next

[module/battery]
type = internal/battery
; This is useful in case the battery never reports 100% charge
full-at = 95

; format-low once this charge percentage is reached
; Default: 10
; New in version 3.6.0
low-at = 10

; Use the following command to list batteries and adapters:
; $ ls -1 /sys/class/power_supply/
battery = BAT0
adapter = AC0

; If an inotify event haven't been reported in this many
; seconds, manually poll for new values.
;
; Needed as a fallback for systems that don't report events
; on sysfs/procfs.
;
; Disable polling by setting the interval to 0.
;
poll-interval = 5
time-format = %H:%M
format-charging = %{A3:$HOME/.config/rofi/battery set:}%{A1:$HOME/.config/rofi/battery stat:}󱘖 <animation-charging>%{A}%{A}
format-discharging = %{A3:$HOME/.config/rofi/battery set:}%{A1:$HOME/.config/rofi/battery stat:}<ramp-capacity> <label-discharging>%{A}%{A}
label-discharging =  %percentage%%



label-full = 󰁹
label-low = 󰂃 

format-full = %{A3:$HOME/.config/rofi/battery set:}%{A1:$HOME/.config/rofi/battery stat:}<label-full>%{A}%{A}
format-low = %{A3:$HOME/.config/rofi/battery set:}%{A1:$HOME/.config/rofi/battery stat:}<animation-low>%{A}%{A}

ramp-capacity-0 = 󰂎 
ramp-capacity-1 = 󰁺 
ramp-capacity-2 = 󰁻 
ramp-capacity-3 = 󰁼 
ramp-capacity-4 = 󰁽 
ramp-capacity-5 = 󰁾 
ramp-capacity-6 = 󰁿 
ramp-capacity-7 = 󰂀 
ramp-capacity-8 = 󰂁 
ramp-capacity-9 = 󰂂 
ramp-capacity-10 = 󰁹

; Only applies if <bar-capacity> is used
#bar-capacity-width = 10

animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂇
animation-charging-3 = 󰂈
animation-charging-4 = 󰢝
animation-charging-5 = 󰂉
animation-charging-6 = 󰢞
animation-charging-7 = 󰂊
animation-charging-8 = 󰂋
animation-charging-9 = 󰂅
; Framerate in milliseconds
animation-charging-framerate = 750

; Framerate in milliseconds
animation-discharging-framerate = 500

; New in version 3.6.0
animation-low-0 = !
animation-low-1 = 󰂃
animation-low-framerate = 200

[module/tray]
type = internal/tray
#foreground = #ffffff


[settings]
screenchange-reload = true
#pseudo-transparency = true

