
[colors]
background = #282A2E
background-alt = #373B41
foreground = #C5C8C6
primary = #F0C674
secondary = #8ABEB7
alert = #A54242
disabled = #707880
black = #000000
white = #FFFFFF
gray = #808080

[bar/mybar]
width = 100%
height = 20pt
radius = 0
#override-redirect = true
wm-restack = bspwm
monitor = ${env:MONITOR:fallback-value}

; dpi = 96

foreground = ${colors.white}
background = ${colors.black}

#line-size = 3pt

#border-size = 2pt
#border-color = #ffffff

padding-left = 2
padding-right = 1

module-margin = 1

separator = 

font-0 = "JetBrainsMono Nerd Font:style=Normal"
font-1 = "WenQuanYi Zen Hei Mono:style=Normal"


modules-left = apps date 
modules-center = bspwm 
fixed-center = true
modules-right = mpris bspwm_layout quickmemo xkeyboard pulseaudio headset bluetooth mic-muted wlan powerprofile battery power

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true


[module/bspwm]
type = internal/bspwm

pin-workspaces = true
inline-mode = false


label-focused = 
label-focused-padding = 1
label-focused-foreground = ${colors.white}

label-occupied = 
label-occupied-padding = 1
label-occupied-foreground = ${colors.gray}

label-urgent =  
label-urgent-foreground = #ff0000
label-urgent-padding = 1

label-empty =  
label-empty-foreground = ${colors.white}
label-empty-padding = 1

format = <label-state>

[module/bspwm_layout]
type = internal/bspwm
#format = <label-mode> <label-monitor>
format = <label-mode>
label-monocle = "󰪏" 


[module/xwindow]
type = internal/xwindow
label = | %instance% %title%
label-maxlen = 40
label-minlen = 40
format-padding = 0px

