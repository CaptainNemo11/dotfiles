"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status$git_commit\
$python\
$rust\
$ocaml\
$line_break\
$character"""

[directory]
style = "blue"
truncate_to_repo = false
truncation_length = 10
truncation_symbol =  '.../'
read_only = ""

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
only_attached = true
style = "bright-black"

[git_commit]
format = '[$hash $tag]($style)'
commit_hash_length = 7
tag_symbol = ""
tag_disabled = false
only_detached = true
style = "bright-black"


[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"
use_git_executable = true

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []

[rust]
format = "[$toolchain]($style)"
style = "bright-black"

[ocaml]
format = "[$switch_name]($style)"
style = "bright-black"


